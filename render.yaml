databases:
  - name: cancel-hansel-db
    databaseName: cancel_hansel
    user: cancel_hansel
    plan: free

services:
  - type: web
    name: cancel-hansel-api
    runtime: node
    rootDir: services/api
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cancel-hansel-db
          property: connectionString

  - type: web
    name: cancel-hansel-dashboard
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: cancel-hansel-api
          type: web
          property: url
